<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>要点试验 · A Christmas Carol</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262b36;--text:#e8eaf0;--dim:#8b93a5;
--acc:#5b8cff;--ok:#38b48b;--bad:#e2585c;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:calc(24px + var(--safe))}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 0 4px}
.src{font-size:12px;color:var(--dim);line-height:1.5}
main{padding:14px 14px 0}
.unit{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.head{padding:14px 15px;display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 26px;height:26px;border-radius:8px;background:#243049;color:var(--acc);
display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.point{font-size:16px;font-weight:600;line-height:1.45}
.kw{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.body{border-top:1px solid var(--line);padding:14px 15px;display:none}
.body.open{display:block}
h3{font-size:12px;color:var(--dim);margin:0 0 8px;letter-spacing:.5px;font-weight:600}
.q{font-size:15px;margin:0 0 10px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;background:#20242d;border:1px solid var(--line);
color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:8px;line-height:1.4}
.opt.right{border-color:var(--ok);background:#12301f}
.opt.wrong{border-color:var(--bad);background:#341417}
.fb{font-size:13px;color:var(--dim);margin:2px 0 0;line-height:1.6}
.rw{background:#141821;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:6px}
.rw p{margin:0 0 8px;font-size:15px;line-height:1.65}
.rw .cn{font-size:13px;color:var(--dim);margin:0}
.rw .mark{color:var(--acc);border-bottom:1px dashed rgba(91,140,255,.5)}
.tip{font-size:12px;color:var(--dim);padding:4px 4px 18px;line-height:1.7}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>要点 → 题 → 换语境重写</h1>
  <div class="src">材料：A Christmas Carol（4,000 词级分级读物，Paul Nation / Gerry Meister，免费合法）· 第 1 章节选 4,200 字符<br>
  这是试验样品：要点由 AI 提炼，题和重写段落由 AI 生成。</div>
</header>
<main id="app"></main>
<div class="tip" style="padding:14px">
  试验目的：只验一件事——<b>AI 抓的要点像不像你想学的重点</b>。<br>
  如果要点抓错了，后面的题和重写都是在错的东西上加倍。
</div>

<script>
const UNITS = [
  {
    point: "开头反复强调「Marley 死了」，是故意的铺垫，不是啰嗦。",
    keywords: ["as dead as a door-nail", "no doubt whatever", "distinctly understood"],
    quiz: {
      q: "叙述者为什么要把「Marley 死了」说上好几遍？",
      options: [
        "为了凑字数，维多利亚时代流行这种写法",
        "先把这个事实钉死，后面鬼魂出现才有冲击力",
        "他记不清 Marley 到底死没死",
        "为了强调 Marley 是本书的主角"
      ],
      answer: 1,
      explain: "反复确认=建立不可动摇的事实。事实越硬，后面鬼魂出现的反转越狠。这是叙事策略，不是废话。"
    },
    rewrite: {
      en: "The old man was gone — there was no doubt whatever about that. The hospital record was signed, the family had cried, the neighbours had watched the coffin go by. He was as dead as a door-nail. And yet, on the very night of the funeral, his chair in the office was still warm.",
      cn: "老人走了——这件事毫无疑问。医院记录签了字，家人哭过，邻居看着棺木经过。他死得透透的。然而就在葬礼当晚，他办公室的那把椅子还是温的。",
      note: "同一条叙事策略，换到现代场景：先确认死亡，再让「椅子还温着」制造反差。"
    }
  },
  {
    point: "Scrooge 和 Marley 是合伙人，但这份「关系」只到生意为止。",
    keywords: ["partners", "sole administrator", "sole mourner", "man of business"],
    quiz: {
      q: "「sole friend, and sole mourner」这两个 sole，作者的用意是什么？",
      options: [
        "说明 Scrooge 人缘极好，大家都来送葬",
        "说明 Scrooge 是唯一到场的人，反衬他孤僻",
        "说明 Marley 没有别的亲人",
        "说明葬礼办得很隆重"
      ],
      answer: 1,
      explain: "sole=唯一的。既是唯一的朋友又是唯一的送葬人，等于说：除了他，没有别人。生意上的合伙人，人情上的孤家寡人。"
    },
    rewrite: {
      en: "They had been partners for thirty years. When the older man died, the younger one signed every paper, arranged the funeral, and stood alone at the grave. By two o'clock that afternoon he was back at his desk, closing a deal.",
      cn: "他们合伙了三十年。老人去世时，年轻的那个签了每一份文件、安排了葬礼、独自站在墓前。当天下午两点，他已经回到办公桌前谈成了一笔生意。",
      note: "把「合伙人+唯一送葬人+葬礼当天就做生意」三件事压进一段，正是原著的写法。"
    }
  },
  {
    point: "写 Scrooge 的「冷」，用的是一串挤压感的动词，不是形容词堆砌。",
    keywords: ["squeezing", "grasping", "scraping", "clutching", "grindstone"],
    quiz: {
      q: "squeezing / grasping / scraping / clutching 这组词共同的画面感是？",
      options: [
        "轻快、灵活",
        "死死抓住、往自己这边刮",
        "优雅、体面",
        "迟缓、笨重"
      ],
      answer: 1,
      explain: "四个词都是「抓紧、刮取」的动作，全是手部发力往自己这边收——这就是吝啬的画面。比直接写「他很贪」有力得多。"
    },
    rewrite: {
      en: "He squeezed every coin until it squeaked. He grasped at discounts, scraped the last cent off a bill, and clutched his wallet like a man drowning. Nobody ever saw him give anything away — not a coin, not a smile.",
      cn: "他把每一枚硬币都攥到吱吱响。他死抓折扣，把账单刮到最后一分，像快要淹死的人那样攥着钱包。没人见过他给出去过什么——不是一分钱，也不是一个笑。",
      note: "同一组动作词，换到现代商业场景，仍然成立。"
    }
  },
  {
    point: "「冷」是 Scrooge 本人，不是天气——作者把内外颠倒了。",
    keywords: ["external heat and cold", "no warmth could warm", "bitterer than he"],
    quiz: {
      q: "「No warmth could warm, no wintry weather chill him」是什么意思？",
      options: [
        "他很耐寒，冬夏都不怕",
        "外界的冷暖对他不起作用，因为他自己就是冷的源头",
        "他住的地方没有暖气",
        "他生病了，感觉不到温度"
      ],
      answer: 1,
      explain: "这句把因果关系倒过来：不是天气影响他，是他比天气更冷（下一句 no wind was bitterer than he）。这种「内外颠倒」是狄更斯写性格的常用手法。"
    },
    rewrite: {
      en: "The heating in his office broke one winter, and nobody noticed. He was colder than the radiators had ever been. Summer came, and the room stayed at his temperature — a temperature that had nothing to do with the season.",
      cn: "有一年冬天他办公室的暖气坏了，没人察觉。他比暖气曾经达到的温度还冷。夏天来了，那间屋子还是维持着他的温度——一个跟季节无关的温度。",
      note: "把「他比天气更冷」这个颠倒，换成现代办公室的版本。"
    }
  },
  {
    point: "作者不直接说「人人讨厌他」，而是让整条街替他说话。",
    keywords: ["beggars", "inquire the way", "blind men's dogs", "keep its distance"],
    quiz: {
      q: "连「盲人的狗」都躲着他，这个细节的作用是？",
      options: [
        "说明伦敦的狗很多",
        "把厌恶推到荒诞的程度：连看不见他的动物都避开他",
        "说明 Scrooge 怕狗",
        "为了增加幽默感"
      ],
      answer: 1,
      explain: "盲人的狗看不见他的脸，却会把他往门洞里拽——等于说「厌恶不需要理由，也不需要眼睛」。这是把抽象的社会排斥写成具体画面。"
    },
    rewrite: {
      en: "No beggar ever asked him for change. No child ever asked him the time. Delivery drivers learned to leave parcels at the door and not ring. Even the guide dog at the corner would pull its owner into a doorway when he walked past.",
      cn: "没有乞丐向他要过零钱，没有孩子问过他时间。快递员学会了把包裹放在门口不按铃。连街角那只导盲犬，在他经过时都会把主人往门洞里拽。",
      note: "同一套「旁人反应」写法，换成现代城市。"
    }
  },
  {
    point: "圣诞夜的寒冷天气，是人物性格的外化，不是背景板。",
    keywords: ["counting-house", "bleak", "biting", "foggy", "flaring"],
    quiz: {
      q: "「三点天就黑了，烛光像棕色空气上的红污渍」这类描写，主要起什么作用？",
      options: [
        "交代具体时间和地点",
        "让环境的阴冷与 Scrooge 的冷酷互相印证",
        "为了展示作者的文采",
        "暗示即将下雪"
      ],
      answer: 1,
      explain: "环境描写在这里是「共振」：外面越冷越暗，屋里那个人越显得冷。后面鬼魂登场时，同样的天气写法会转成恐怖气氛——同一套笔法两用。"
    },
    rewrite: {
      en: "It was three in the afternoon and already dark. Fog pressed against the windows; candles in the neighbouring offices burned like red smears on brown air. Inside, one small fire, one cold man, one shivering clerk.",
      cn: "下午三点，天已经黑了。雾贴着窗户；隔壁办公室的烛光像棕色空气上的红污渍。屋里：一小炉火、一个冷冰冰的人、一个发抖的办事员。",
      note: "保留原句的三个意象（三点就黑、红污渍、一小炉火），只把句子压缩。"
    }
  }
];

const app = document.getElementById('app');
app.innerHTML = UNITS.map((u, i) => `
  <section class="unit">
    <div class="head">
      <div class="num">${i + 1}</div>
      <div style="flex:1">
        <div class="point">${u.point}</div>
        <div class="kw">${u.keywords.map((k) => `<span>${k}</span>`).join('')}</div>
      </div>
    </div>
    <div class="body" id="b${i}">
      <h3>考这一条</h3>
      <p class="q">${u.quiz.q}</p>
      ${u.quiz.options.map((o, j) => `<button class="opt" data-u="${i}" data-j="${j}">${o}</button>`).join('')}
      <p class="fb" id="f${i}"></p>
      <h3 style="margin-top:16px">换语境重写</h3>
      <div class="rw">
        <p>${u.rewrite.en}</p>
        <p class="cn">${u.rewrite.cn}</p>
        <p class="cn" style="margin-top:8px">▸ ${u.rewrite.note}</p>
      </div>
    </div>
  </section>
`).join('');

app.querySelectorAll('.head').forEach((h, i) => {
  h.onclick = () => document.getElementById('b' + i).classList.toggle('open');
});
app.querySelectorAll('.opt').forEach((btn) => {
  btn.onclick = () => {
    const i = +btn.dataset.u, j = +btn.dataset.j;
    const u = UNITS[i];
    const box = document.getElementById('b' + i);
    box.querySelectorAll('.opt').forEach((b, k) => {
      b.classList.remove('right', 'wrong');
      if (k === u.quiz.answer) b.classList.add('right');
      if (k === j && j !== u.quiz.answer) b.classList.add('wrong');
    });
    document.getElementById('f' + i).textContent = u.quiz.explain;
  };
});
</script>
</body>
</html>
